<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 1 Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HSK 1 Flashcards</h1>
  <div id="cats" class="cats"></div>
  <p id="counter"></p>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <span id="english"></span>
        <small>Tap to flip</small>
      </div>
      <div class="face back">
        <div id="hanzi"></div>
        <div id="pinyin"></div>
        <button id="speak" title="Play pronunciation">🔊 Listen</button>
        <div class="example">
          <div id="exZh"></div>
          <div id="exEn"></div>
          <button id="speakEx" class="small">🔊 Sentence</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="shuffle">🔀 Shuffle</button>
    <button id="next">Next →</button>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
