<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 1 Flashcards</title>
  <style>
* { box-sizing: border-box; }
body {
  font-family: system-ui, sans-serif; background: #f4efe6;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; margin: 0; padding: 20px;
}
h1 { color: #b3261e; margin: 0 0 12px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px; }
.chip { background: #fff; color: #333; border: 1px solid #ddd; padding: 6px 12px; font-size: .9rem; border-radius: 20px; }
.chip:hover { background: #f3d9d6; }
.chip.active { background: #b3261e; color: #fff; border-color: #b3261e; }
.scene { width: 340px; height: 400px; perspective: 1000px; margin: 12px 0 20px; }
.card { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; background: #fff;
  border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.15);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; text-align: center;
}
.front #english { font-size: 2.2rem; font-weight: 600; }
.front small { position: absolute; bottom: 14px; color: #999; }
.back { transform: rotateY(180deg); gap: 8px; }
#hanzi { font-size: 3.6rem; }
#pinyin { font-size: 1.5rem; color: #b3261e; }
.example { margin-top: 8px; border-top: 1px solid #eee; padding-top: 10px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
#exZh { font-size: 1.2rem; }
#exEn { color: #555; font-size: .95rem; }
button { padding: 10px 16px; border: none; border-radius: 8px; background: #b3261e; color: #fff; font-size: 1rem; cursor: pointer; }
button:hover { background: #8f1e18; }
button.small { padding: 5px 10px; font-size: .85rem; margin-top: 4px; background: #777; }
.controls { display: flex; gap: 10px; }

</style>
</head>
<body>
  <h1>HSK 1 Flashcards</h1>
  <div id="cats" class="cats"></div>
  <p id="counter"></p>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <span id="english"></span>
        <small>Tap to flip</small>
      </div>
      <div class="face back">
        <div id="hanzi"></div>
        <div id="pinyin"></div>
        <button id="speak" title="Play pronunciation">🔊 Listen</button>
        <div class="example">
          <div id="exZh"></div>
          <div id="exEn"></div>
          <button id="speakEx" class="small">🔊 Sentence</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="shuffle">🔀 Shuffle</button>
    <button id="next">Next →</button>
  </div>

const words = Object.entries(data).flatMap(([cat, list]) =>
  list.map(([en, zh, pinyin, exZh, exEn]) => ({ cat, en, zh, pinyin, exZh, exEn })));

const $ = id => document.getElementById(id);
const card = $("card");
let current = "all";
let deck = [...words];
let index = 0;

function buildChips() {
  const box = $("cats");
  const make = (key, label, n) => {
    const b = document.createElement("button");
    b.className = "chip" + (key === current ? " active" : "");
    b.textContent = `${label} (${n})`;
    b.onclick = () => { current = key; setDeck(); buildChips(); };
    box.appendChild(b);
  };
  box.innerHTML = "";
  make("all", "📚 All words", words.length);
  Object.keys(LABELS).forEach(k => make(k, LABELS[k], words.filter(w => w.cat === k).length));
}

function setDeck() {
  deck = current === "all" ? [...words] : words.filter(w => w.cat === current);
  index = 0;
  render();
}

function render() {
  const w = deck[index];
  card.classList.remove("flipped");
  $("english").textContent = w.en;
  $("hanzi").textContent = w.zh;
  $("pinyin").textContent = w.pinyin;
  $("exZh").textContent = w.exZh;
  $("exEn").textContent = w.exEn;
  $("counter").textContent = `Card ${index + 1} / ${deck.length}`;
}

function speak(text) {
  if (!("speechSynthesis" in window)) { alert("Your browser doesn't support speech."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.8;
  const voice = (speechSynthesis.getVoices() || []).find(v => v.lang.startsWith("zh"));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

card.addEventListener("click", () => card.classList.toggle("flipped"));
$("speak").onclick = e => { e.stopPropagation(); speak(deck[index].zh.replace(/ \/ .*/, "")); };
$("speakEx").onclick = e => { e.stopPropagation(); speak(deck[index].exZh.replace(/^[AB]: /, "")); };
$("next").onclick = () => { index = (index + 1) % deck.length; render(); };
$("prev").onclick = () => { index = (index - 1 + deck.length) % deck.length; render(); };
$("shuffle").onclick = () => { deck.sort(() => Math.random() - 0.5); index = 0; render(); };

buildChips();
render();
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

</script>
